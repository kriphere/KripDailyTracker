<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Krips Daily Tracker</title>
    <style>
      :root {
        --bg: #f3f6ff;
        --bg-strong: #e7edff;
        --panel: #ffffff;
        --panel-alt: #f8faff;
        --primary: #4f46e5;
        --primary-dark: #312e81;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #dfe7ff;
        --shadow: 0 18px 40px rgba(79, 70, 229, 0.12);
        --chip: #eef2ff;
        --success: #16a34a;
        --warning: #f59e0b;
        --danger: #ef4444;
        --chart-grid: rgba(79, 70, 229, 0.12);
      }

      body.dark {
        --bg: #0f172a;
        --bg-strong: #111827;
        --panel: #111827;
        --panel-alt: #1f2937;
        --primary: #8b5cf6;
        --primary-dark: #c4b5fd;
        --text: #f8fafc;
        --muted: #cbd5e1;
        --border: rgba(148, 163, 184, 0.18);
        --shadow: 0 18px 40px rgba(15, 23, 42, 0.5);
        --chip: rgba(139, 92, 246, 0.12);
        --success: #4ade80;
        --warning: #fbbf24;
        --danger: #f87171;
        --chart-grid: rgba(148, 163, 184, 0.2);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, var(--bg), var(--bg-strong));
        color: var(--text);
        transition: background 0.2s ease, color 0.2s ease;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 28px 18px 50px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 22px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 3rem);
      }

      .title-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(79, 70, 229, 0.08);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 8px 14px;
        color: var(--primary-dark);
        font-weight: 700;
        font-size: 0.82rem;
      }

      .layout {
        display: grid;
        grid-template-columns: 360px minmax(0, 1fr);
        gap: 22px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: 22px;
      }

      form {
        display: grid;
        gap: 18px;
      }

      .field-group {
        display: grid;
        gap: 8px;
      }

      label {
        font-weight: 700;
        font-size: 0.96rem;
      }

      input, select, textarea, button {
        font: inherit;
      }

      input, select, textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        background: transparent;
        color: var(--text);
      }

      textarea {
        min-height: 90px;
        resize: vertical;
      }

      .inline-fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .primary-btn, .secondary-btn, .ghost-btn, .delete-btn {
        border: none;
        border-radius: 12px;
        padding: 11px 15px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      .primary-btn {
        background: var(--primary);
        color: white;
      }

      .secondary-btn {
        background: var(--chip);
        color: var(--primary-dark);
      }

      .ghost-btn {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }

      .delete-btn {
        background: rgba(239, 68, 68, 0.1);
        color: var(--danger);
        padding: 8px 12px;
      }

      .primary-btn:hover, .secondary-btn:hover, .ghost-btn:hover, .delete-btn:hover {
        transform: translateY(-1px);
        opacity: 0.96;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
        justify-content: space-between;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 18px;
      }

      .stat-box {
        background: linear-gradient(180deg, var(--panel-alt), rgba(79, 70, 229, 0.04));
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 16px;
      }

      .stat-label {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .stat-value {
        margin-top: 8px;
        font-size: clamp(1.4rem, 2vw, 2rem);
        font-weight: 800;
      }

      .filter-box {
        margin-bottom: 18px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        align-items: end;
      }

      .filter-box .field-group {
        min-width: 0;
      }

      .chart-panel {
        margin-bottom: 18px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--panel-alt);
        padding: 12px;
      }

      .chart-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }

      .chart-wrap {
        width: 100%;
        min-height: 200px;
      }

      .chart-wrap svg {
        width: 100%;
        height: 220px;
        display: block;
      }

      .entries-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        gap: 12px;
      }

      .entries-list {
        display: grid;
        gap: 14px;
      }

      .entry-card {
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 16px;
      }

      .entry-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }

      .entry-date {
        font-weight: 800;
        font-size: 1.05rem;
      }

      .mood-pill {
        display: inline-flex;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 700;
        color: #111827;
      }

      .entry-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 10px 0 12px;
      }

      .chip {
        background: var(--chip);
        color: var(--primary-dark);
        border-radius: 999px;
        padding: 7px 10px;
        font-size: 0.8rem;
        font-weight: 700;
      }

      .entry-notes {
        color: var(--muted);
        line-height: 1.5;
      }

      .empty-state {
        border: 1px dashed var(--border);
        border-radius: 16px;
        background: var(--panel-alt);
        padding: 30px 18px;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 820px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .stats, .filter-box {
          grid-template-columns: 1fr;
        }

        .topbar, .entries-header {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <h1>Krips Daily Tracker</h1>
        <div class="title-badge">Wellness log</div>
      </div>

      <div class="layout">
        <section class="panel">
          <form id="entryForm">
            <div class="field-group">
              <label for="date">Date</label>
              <input id="date" name="date" type="date" required />
            </div>

            <div class="field-group">
              <label for="calories">Calories</label>
              <input id="calories" name="calories" type="number" min="0" step="1" placeholder="e.g. 2100" required />
            </div>

            <div class="inline-fields">
              <div class="field-group">
                <label for="mood">Mood</label>
                <select id="mood" name="mood" required>
                  <option value="Happy">Happy</option>
                  <option value="Calm">Calm</option>
                  <option value="Motivated">Motivated</option>
                  <option value="Tired">Tired</option>
                  <option value="Stressed">Stressed</option>
                </select>
              </div>

              <div class="field-group">
                <label for="energy">Energy</label>
                <select id="energy" name="energy" required>
                  <option value="1">1 / 10</option>
                  <option value="2">2 / 10</option>
                  <option value="3">3 / 10</option>
                  <option value="4">4 / 10</option>
                  <option value="5" selected>5 / 10</option>
                  <option value="6">6 / 10</option>
                  <option value="7">7 / 10</option>
                  <option value="8">8 / 10</option>
                  <option value="9">9 / 10</option>
                  <option value="10">10 / 10</option>
                </select>
              </div>
            </div>

            <div class="field-group">
              <label for="notes">Notes</label>
              <textarea id="notes" name="notes" placeholder="How are you feeling today?"></textarea>
            </div>

            <div class="toolbar">
              <button class="primary-btn" type="submit">Save entry</button>
              <button id="themeToggle" class="ghost-btn" type="button">Dark mode</button>
            </div>
          </form>
        </section>

        <section class="panel">
          <div class="stats">
            <div class="stat-box">
              <div class="stat-label">Average calories</div>
              <div id="avgCalories" class="stat-value">0</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Average energy</div>
              <div id="avgEnergy" class="stat-value">0</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Common mood</div>
              <div id="commonMood" class="stat-value">-</div>
            </div>
          </div>

          <div class="filter-box">
            <div class="field-group">
              <label for="fromDate">From</label>
              <input id="fromDate" type="date" />
            </div>
            <div class="field-group">
              <label for="toDate">To</label>
              <input id="toDate" type="date" />
            </div>
            <div class="field-group">
              <label>&nbsp;</label>
              <div style="display:flex; gap:10px;">
                <button id="applyFilterBtn" class="secondary-btn" type="button">Apply</button>
                <button id="clearFilterBtn" class="ghost-btn" type="button">Clear</button>
              </div>
            </div>
          </div>

          <div class="chart-panel">
            <div class="chart-title">
              <strong>Calories trend</strong>
              <span id="filterCount" class="chip">0 entries</span>
            </div>
            <div id="chart" class="chart-wrap"></div>
          </div>

          <div class="entries-header">
            <h2>Saved entries</h2>
            <div style="display:flex; gap:10px;">
              <button id="exportCsvBtn" class="secondary-btn" type="button">Export CSV</button>
              <button id="clearAllBtn" class="ghost-btn" type="button">Clear all</button>
            </div>
          </div>

          <div id="entriesList" class="entries-list"></div>
        </section>
      </div>
    </div>

    <script>
      const STORAGE_KEY = 'kripsDailyTrackerEntries';
      const THEME_KEY = 'kripsDailyTrackerTheme';

      const form = document.getElementById('entryForm');
      const entriesList = document.getElementById('entriesList');
      const avgCaloriesEl = document.getElementById('avgCalories');
      const avgEnergyEl = document.getElementById('avgEnergy');
      const commonMoodEl = document.getElementById('commonMood');
      const clearAllBtn = document.getElementById('clearAllBtn');
      const exportCsvBtn = document.getElementById('exportCsvBtn');
      const themeToggleBtn = document.getElementById('themeToggle');
      const filterCountEl = document.getElementById('filterCount');
      const fromDateInput = document.getElementById('fromDate');
      const toDateInput = document.getElementById('toDate');
      const applyFilterBtn = document.getElementById('applyFilterBtn');
      const clearFilterBtn = document.getElementById('clearFilterBtn');
      const chartEl = document.getElementById('chart');

      const moodColors = {
        Happy: '#bbf7d0',
        Calm: '#bfdbfe',
        Motivated: '#fef3c7',
        Tired: '#e9d5ff',
        Stressed: '#fecaca'
      };

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function getTodayString() {
        return new Date().toISOString().split('T')[0];
      }

      function getInitialEntries() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
          return Array.isArray(saved) ? saved : [];
        } catch (error) {
          return [];
        }
      }

      function getInitialTheme() {
        try {
          return JSON.parse(localStorage.getItem(THEME_KEY) || 'false');
        } catch (error) {
          return false;
        }
      }

      const state = {
        entries: getInitialEntries(),
        theme: getInitialTheme(),
        filters: { from: '', to: '' }
      };

      function saveEntries() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.entries));
      }

      function saveTheme() {
        localStorage.setItem(THEME_KEY, JSON.stringify(state.theme));
      }

      function applyTheme() {
        document.body.classList.toggle('dark', state.theme);
        themeToggleBtn.textContent = state.theme ? 'Light mode' : 'Dark mode';
      }

      function getFilteredEntries() {
        let filtered = [...state.entries];

        if (state.filters.from) {
          filtered = filtered.filter((item) => item.date >= state.filters.from);
        }

        if (state.filters.to) {
          filtered = filtered.filter((item) => item.date <= state.filters.to);
        }

        return filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
      }

      function renderStats(records) {
        if (!records.length) {
          avgCaloriesEl.textContent = '0';
          avgEnergyEl.textContent = '0';
          commonMoodEl.textContent = '-';
          return;
        }

        const totalCalories = records.reduce((sum, item) => sum + Number(item.calories), 0);
        const totalEnergy = records.reduce((sum, item) => sum + Number(item.energy), 0);

        avgCaloriesEl.textContent = Math.round(totalCalories / records.length).toLocaleString();
        avgEnergyEl.textContent = (totalEnergy / records.length).toFixed(1);

        const moodCounts = {};
        records.forEach((item) => {
          moodCounts[item.mood] = (moodCounts[item.mood] || 0) + 1;
        });

        const commonMood = Object.entries(moodCounts).sort((a, b) => b[1] - a[1])[0];
        commonMoodEl.textContent = commonMood ? commonMood[0] : '-';
      }

      function renderChart(records) {
        if (!records.length) {
          chartEl.innerHTML = '<div class="empty-state">No chart data for the selected date range.</div>';
          return;
        }

        const recent = [...records]
          .sort((a, b) => new Date(a.date) - new Date(b.date))
          .slice(-7);

        const maxCalories = Math.max(1, ...recent.map((item) => Number(item.calories)));
        const chartWidth = 440;
        const chartHeight = 210;
        const padding = 28;
        const usableWidth = chartWidth - padding * 2;
        const usableHeight = chartHeight - padding * 2;
        const barWidth = Math.max(24, usableWidth / recent.length - 18);

        const bars = recent.map((item, index) => {
          const x = padding + index * (usableWidth / recent.length) + 8;
          const value = Number(item.calories);
          const barHeight = (value / maxCalories) * usableHeight;
          const y = chartHeight - padding - barHeight;
          const label = item.date.slice(5);

          return `
            <g>
              <rect x="${x}" y="${y}" width="${barWidth}" height="${barHeight}" rx="8" fill="#4f46e5" opacity="0.9"></rect>
              <text x="${x + barWidth / 2}" y="${chartHeight - 8}" text-anchor="middle" font-size="10" fill="currentColor">${label}</text>
            </g>
          `;
        }).join('');

        const gridLines = [0, 0.25, 0.5, 0.75, 1]
          .map((point) => {
            const y = chartHeight - padding - point * usableHeight;
            return `<line x1="${padding}" y1="${y}" x2="${chartWidth - padding}" y2="${y}" stroke="var(--chart-grid)" stroke-width="1"></line>`;
          })
          .join('');

        chartEl.innerHTML = `
          <svg viewBox="0 0 ${chartWidth} ${chartHeight}" role="img" aria-label="Calories chart">
            ${gridLines}
            ${bars}
          </svg>
        `;
      }

      function renderEntries(records) {
        if (!records.length) {
          entriesList.innerHTML = '<div class="empty-state">No entries found for this date range.</div>';
          return;
        }

        entriesList.innerHTML = records
          .map((entry) => {
            const moodColor = moodColors[entry.mood] || '#e0e7ff';
            const safeNotes = escapeHtml(entry.notes || 'No notes added.');
            return `
              <div class="entry-card">
                <div class="entry-top">
                  <div class="entry-date">${escapeHtml(entry.date)}</div>
                  <span class="mood-pill" style="background:${moodColor};">${escapeHtml(entry.mood)}</span>
                </div>

                <div class="entry-meta">
                  <div class="chip">Calories: ${Number(entry.calories).toLocaleString()}</div>
                  <div class="chip">Energy: ${Number(entry.energy)}/10</div>
                </div>

                <div class="entry-notes">${safeNotes}</div>

                <div style="margin-top: 14px; text-align: right;">
                  <button class="delete-btn" data-id="${entry.id}" type="button">Delete</button>
                </div>
              </div>
            `;
          })
          .join('');
      }

      function renderApp() {
        const records = getFilteredEntries();
        renderStats(records);
        renderEntries(records);
        renderChart(records);
        filterCountEl.textContent = `${records.length} ${records.length === 1 ? 'entry' : 'entries'}`;
        applyTheme();
      }

      function handleFormSubmit(event) {
        event.preventDefault();

        const formData = new FormData(form);
        const newEntry = {
          id: Date.now(),
          date: formData.get('date'),
          calories: Number(formData.get('calories')),
          mood: formData.get('mood'),
          energy: Number(formData.get('energy')),
          notes: String(formData.get('notes') || '').trim()
        };

        if (!newEntry.date || !Number.isFinite(newEntry.calories) || !newEntry.mood) {
          return;
        }

        state.entries.unshift(newEntry);
        saveEntries();
        form.reset();
        document.getElementById('date').value = getTodayString();
        renderApp();
      }

      function handleDelete(event) {
        const button = event.target.closest('.delete-btn');
        if (!button) return;

        const idToRemove = Number(button.dataset.id);
        state.entries = state.entries.filter((entry) => entry.id !== idToRemove);
        saveEntries();
        renderApp();
      }

      function exportCsv() {
        const records = getFilteredEntries();

        if (!records.length) {
          window.alert('There are no entries to export.');
          return;
        }

        const headers = ['Date', 'Calories', 'Mood', 'Energy', 'Notes'];
        const rows = records.map((entry) => [
          entry.date,
          entry.calories,
          entry.mood,
          entry.energy,
          `"${String(entry.notes || '').replace(/"/g, '""')}"`
        ]);

        const csv = [headers, ...rows]
          .map((row) => row.join(','))
          .join('\n');

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'krips-daily-tracker.csv';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }

      themeToggleBtn.addEventListener('click', () => {
        state.theme = !state.theme;
        saveTheme();
        renderApp();
      });

      form.addEventListener('submit', handleFormSubmit);
      entriesList.addEventListener('click', handleDelete);

      clearAllBtn.addEventListener('click', () => {
        if (!state.entries.length) return;

        const confirmed = window.confirm('Clear all saved entries?');
        if (!confirmed) return;

        state.entries = [];
        saveEntries();
        renderApp();
      });

      applyFilterBtn.addEventListener('click', () => {
        state.filters = {
          from: fromDateInput.value,
          to: toDateInput.value
        };
        renderApp();
      });

      clearFilterBtn.addEventListener('click', () => {
        state.filters = { from: '', to: '' };
        fromDateInput.value = '';
        toDateInput.value = '';
        renderApp();
      });

      exportCsvBtn.addEventListener('click', exportCsv);

      document.getElementById('date').value = getTodayString();
      renderApp();
    </script>
  </body>
</html>
